<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Processing - Real-time Status</title>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        .upload-section {
            margin-bottom: 30px;
        }
        .status-section {
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
            margin-top: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status-queued { background-color: #fff3cd; color: #856404; }
        .status-processing { background-color: #cce5ff; color: #004085; }
        .status-completed { background-color: #d4edda; color: #155724; }
        .status-failed { background-color: #f8d7da; color: #721c24; }
        .logs {
            margin-top: 15px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #eee;
        }
        .links {
            margin-top: 15px;
        }
        .links a {
            display: block;
            padding: 8px;
            margin: 5px 0;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
        }
        .links a:hover {
            background-color: #0056b3;
        }
        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        input[type="file"] {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Processing - Real-time Status</h1>
        
        <div class="upload-section">
            <h3>Upload Image</h3>
            <input type="file" id="fileInput" accept="image/*">
            <br>
            <button id="uploadBtn">Upload and Process</button>
        </div>

        <div class="status-section" id="statusSection" style="display: none;">
            <h3>Job Status</h3>
            <div>
                Job ID: <strong id="jobId"></strong>
                <span id="statusBadge" class="status-badge"></span>
            </div>
            
            <div class="logs" id="logs"></div>
            
            <div id="linksContainer" style="display: none;">
                <h4>Download Processed Images:</h4>
                <div class="links" id="links"></div>
            </div>
        </div>
    </div>

    <script>
        let connection = null;
        let currentJobId = null;

        // Initialize SignalR connection
        async function initializeConnection() {
            connection = new signalR.HubConnectionBuilder()
                .withUrl("/hubs/jobstatus")
                .withAutomaticReconnect()
                .build();

            connection.on("StatusUpdate", (update) => {
                console.log("Status update received:", update);
                updateStatus(update);
            });

            try {
                await connection.start();
                console.log("SignalR Connected");
                addLog("Connected to real-time status updates");
            } catch (err) {
                console.error("SignalR Connection Error:", err);
                addLog("Failed to connect to real-time updates: " + err);
            }
        }

        // Upload file
        document.getElementById("uploadBtn").addEventListener("click", async () => {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];
            
            if (!file) {
                alert("Please select a file first");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            try {
                document.getElementById("uploadBtn").disabled = true;
                addLog("Uploading file...");

                const response = await fetch("/upload-image", {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    currentJobId = result.id;
                    
                    document.getElementById("statusSection").style.display = "block";
                    document.getElementById("jobId").textContent = currentJobId;
                    
                    addLog(`File uploaded successfully. Job ID: ${currentJobId}`);
                    addLog("Subscribing to real-time updates...");
                    
                    // Subscribe to job updates
                    if (connection && connection.state === signalR.HubConnectionState.Connected) {
                        await connection.invoke("SubscribeToJob", currentJobId);
                        addLog("Subscribed to job updates");
                    }
                    
                    updateStatusBadge(result.status);
                } else {
                    const error = await response.text();
                    addLog("Upload failed: " + error);
                    alert("Upload failed: " + error);
                }
            } catch (err) {
                console.error("Upload error:", err);
                addLog("Upload error: " + err);
                alert("Upload error: " + err);
            } finally {
                document.getElementById("uploadBtn").disabled = false;
            }
        });

        // Update status from SignalR
        function updateStatus(update) {
            const message = update.message || `Status changed to: ${update.status}`;
            addLog(`${message} (${new Date(update.timestamp).toLocaleTimeString()})`);
            updateStatusBadge(update.status);
            
            if (update.status === "completed") {
                fetchJobLinks(update.id);
            }
        }

        // Update status badge
        function updateStatusBadge(status) {
            const badge = document.getElementById("statusBadge");
            badge.textContent = status.toUpperCase();
            badge.className = "status-badge status-" + status;
        }

        // Fetch download links for completed job
        async function fetchJobLinks(jobId) {
            try {
                const response = await fetch(`/status/${jobId}`);
                const result = await response.json();
                
                if (result.links) {
                    const linksContainer = document.getElementById("links");
                    linksContainer.innerHTML = "";
                    
                    for (const [name, url] of Object.entries(result.links)) {
                        const link = document.createElement("a");
                        link.href = url;
                        link.textContent = name.replace(/_/g, " ").toUpperCase();
                        link.target = "_blank";
                        linksContainer.appendChild(link);
                    }
                    
                    document.getElementById("linksContainer").style.display = "block";
                    addLog("All images processed successfully! Download links are ready.");
                }
            } catch (err) {
                console.error("Error fetching links:", err);
                addLog("Error fetching download links: " + err);
            }
        }

        // Add log entry
        function addLog(message) {
            const logs = document.getElementById("logs");
            const entry = document.createElement("div");
            entry.className = "log-entry";
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        // Initialize on page load
        initializeConnection();
    </script>
</body>
</html>
